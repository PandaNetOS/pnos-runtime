name: Build pnos-runtime

on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/pandanetos/pnos-runtime:latest
            ghcr.io/pandanetos/pnos-runtime:${{ github.ref_name }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trigger PNOS-docker assemble
        if: always()
        run: |
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.PNOS_TRIGGER_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/PandaNetOS/PNOS-docker/actions/workflows/build.yml/dispatches \
            -d '{"ref":"main"}'
          echo "PNOS-docker build triggered"
